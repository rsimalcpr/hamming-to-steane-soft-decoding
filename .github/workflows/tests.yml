name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run automated tests
        run: pytest

      - name: Smoke-test Week 1 experiment
        run: >
          python -m experiments.run_classical
          --config configs/classical.toml
          --trials 250
          --no-figure

      - name: Smoke-test Week 3 experiment
        run: >
          python -m experiments.run_quantum_single_pauli
          --config configs/quantum_single_pauli.toml
          --trials 250
          --no-figure
