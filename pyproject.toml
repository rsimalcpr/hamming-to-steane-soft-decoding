[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hamming-to-steane-soft-decoding"
version = "0.1.0.dev1"
description = "A reproducible classical-to-quantum error-correction study"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Rabia Simal Capar"}]
dependencies = [
  "numpy>=2.1,<3",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
